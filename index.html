<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Decodificador de Texto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <section class="esquerda">
            <div class="logo-texto">⚡ Dave Decodificador</div>
            <form id="form-tradutor">
                <textarea id="texto-principal" placeholder="Digite seu texto..."></textarea>
                <div class="controles-inferiores">
                    <div class="alerta">
                        <span class="icone-alerta">⚠️</span>
                        <span>Apenas letras minúsculas e sem acento.</span>
                    </div>
                    <div class="botoes">
                        <button class="bt-cripto" id="criptografar" type="button">🔒 Criptografar</button>
                        <button class="bt-descripto" id="descriptografar" type="button">🔓 Descriptografar</button>
                    </div>
                </div>
            </form>
        </section>

        <section class="direita">
            <div class="sem-retorno" id="container-vazio">
                <div class="icone-busca">🔍</div>
                <h3 class="titulo-sem-retorno">Nenhuma mensagem encontrada</h3>
                <p>Digite um texto que você deseja criptografar ou descriptografar.</p>
            </div>
            <div class="texto-criptografado d-none" id="container-resultado">
                <p id="texto-criptografado"></p>
                <button class="bt-copiar" id="copiar" type="button">📋 Copiar Texto</button>
            </div>
        </section>
    </main>
    
    <footer>
        <p class="links">Por <a href="https://www.linkedin.com/in/david-cavalcante-414573260/" target="_blank" rel="noopener">David Cavalcante</a> | Projetos no <a href="https://github.com/David-Cavalcante" target="_blank" rel="noopener">GitHub</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
